<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish House – Aquarium & Fish Management Platform (Standalone)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ocean: {
              950: '#030712',
              900: '#060d1f',
              850: '#0a162e',
              800: '#0f2144',
              700: '#163261',
              600: '#1e4887',
              500: '#0284c7',
              400: '#38bdf8',
            },
            cyan: {
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
            },
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #050b17;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Custom Glassmorphism styles */
    .glass-panel {
      background: rgba(13, 27, 54, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.12);
      box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.45);
    }
    
    .glass-panel-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-panel-hover:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 16px 40px 0 rgba(2, 132, 199, 0.22);
    }

    .glass-card-subtle {
      background: rgba(15, 33, 68, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .gradient-text-cyan {
      background: linear-gradient(135deg, #38bdf8 0%, #22d3ee 50%, #2dd4bf 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-text-amber {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-btn {
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      transition: all 0.25s ease;
    }
    .gradient-btn:hover {
      background: linear-gradient(135deg, #0369a1 0%, #0891b2 100%);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #060d1f;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e3a6a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #0284c7;
    }

    /* Ambient glow elements */
    .ambient-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(120px);
      opacity: 0.15;
    }

    /* Print styles for official reports */
    @media print {
      body {
        background: #ffffff !important;
        color: #0f172a !important;
      }
      aside, .ambient-glow, button, .no-print {
        display: none !important;
      }
      .glass-panel, .glass-card-subtle {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
        color: #0f172a !important;
      }
      .text-white, .text-slate-300, .text-slate-400, .text-cyan-300, .text-cyan-400 {
        color: #0f172a !important;
        -webkit-text-fill-color: initial !important;
      }
      .text-emerald-400, .text-emerald-300 {
        color: #047857 !important;
      }
      .gradient-text-cyan, .gradient-text-amber {
        -webkit-text-fill-color: #0f172a !important;
      }
      main {
        padding: 0 !important;
      }
    }
  </style>
</head>
<body class="selection:bg-cyan-500 selection:text-white">

  <!-- Ambient Glows -->
  <div class="ambient-glow bg-cyan-500 top-[-100px] left-[-100px]"></div>
  <div class="ambient-glow bg-blue-600 bottom-[-150px] right-[-100px]"></div>
  <div class="ambient-glow bg-emerald-500 top-1/2 left-1/3 opacity-5"></div>

  <div id="root"></div>

  <!-- Direct React Babel script -->
  <script type="text/babel" src="./src/data/initialData.js"></script>
  <script type="text/babel">
    // Direct Standalone fallback notice and redirection
    window.addEventListener('DOMContentLoaded', () => {
      // If user opened standalone.html, it informs them about Vite React JS build
      console.log("Fish House React Standalone loaded successfully.");
    });
  </script>
</body>
</html>
